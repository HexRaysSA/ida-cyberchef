name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  non-gui-and-qt-model-tests:
    strategy:
      fail-fast: false
      matrix:
        # mini-racer ships one py3-none wheel per platform (V8 loaded via
        # ctypes), so every CPython version uses the same engine build.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      IDA_CYBERCHEF_ENABLE_QT_TESTS: "1"
      IDA_CYBERCHEF_ENABLE_GUI_TESTS: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: -p pytestqt.plugin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary :all: -e . pytest tzdata
          python -m pip install pytest-qt pyside6

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Run non-GUI and Qt model tests
        run: pytest -q

  bundle-is-current:
    # ida_cyberchef/data/CyberChef.js is checked in so that installing the
    # plugin needs no npm. Rebuild it from js/ and the submodule and check
    # that the committed bundle, schema and docs match.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install rust-just
          just build

      - name: Check that the committed build output is current
        run: git diff --stat --exit-code -- ida_cyberchef/data docs/ops.md tests/data/cyberchef_test_vectors.json

  offline-wheelhouse:
    # Build a wheelhouse for the runtime dependencies, then install from it
    # with the network index disabled, as an air-gapped IDA user would.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Build wheelhouse
        run: |
          python -m pip download --only-binary :all: --dest wheelhouse "mini-racer>=0.14.1" "pydantic>=2"

      - name: Install offline and run a recipe
        shell: bash
        run: |
          python -m venv offline
          if [ "$RUNNER_OS" = "Windows" ]; then PY=offline/Scripts/python; else PY=offline/bin/python; fi
          $PY -m pip install --no-index --find-links wheelhouse "mini-racer>=0.14.1" "pydantic>=2"
          # IDA ships PySide6 itself; install it from the index to stand in for that.
          $PY -m pip install pyside6
          $PY -c "import sys; sys.path.insert(0, '.'); from ida_cyberchef.cyberchef import bake; assert bake(b'hello', ['To Base64']) == 'aGVsbG8='; print('ok')"
