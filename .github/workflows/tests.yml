name: tests

on:
  push:
  pull_request:

jobs:
  non-gui-and-qt-model-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      IDA_CYBERCHEF_ENABLE_QT_TESTS: "1"
      IDA_CYBERCHEF_ENABLE_GUI_TESTS: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: -p pytestqt.plugin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-qt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Run non-GUI and Qt model tests
        run: pytest -q
